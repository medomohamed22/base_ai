name: gap-logger
# Records Aerodrome vs Hyperliquid stock-perp price gaps every 15 minutes.
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gap-logger.mjs data/gaps.csv
      - run: |
          git config user.name "gap-logger"
          git config user.email "gap-logger@users.noreply.github.com"
          git add data/gaps.csv
          git commit -m "data: gap snapshot" || exit 0
          git push
